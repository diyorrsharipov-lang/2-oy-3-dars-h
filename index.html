<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Where in the world?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./images/main.css">
</head>

<body>
    <header class="header">
        <div class="container">
            <nav class="header__nav">
                <a href="./index.html">
                    <img class="desktop" src="./images/Where in the world_.svg" alt="Where in the world logo">
                    <img class="mobile" src="./images/Where in the world_ (1).svg" alt="Where in the world logo">
                </a>
                <button class="header__btn">Dark mode</button>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="container">
                <div class="boxhero">
                    <div class="hero__input">
                        <img src="./images/icon-search-white.svg" alt="Search icon">
                        <input class="input" type="text" placeholder="Search for a country…">
                    </div>
                </div>
            </div>
        </section>

        <section class="hero2">
            <div class="container">
                <div class="mainbox">
                    <div class="boxflag">
                        <img src="./images/1280px-Flag_of_Germany.svg.svg" alt="Germany Flag">
                        <div class="boxflag__content">
                            <h2 class="hero__h2">Germany</h2>
                        </div>
                    </div>
                    <div class="boxflag">
                        <img src="./images/1280px-Flag_of_Germany.svg (1).svg" alt="USA Flag">
                        <div class="boxflag__content">
                            <h2 class="hero__h2">United States of America</h2>
                        </div>
                    </div>
                    <div class="boxflag">
                        <img src="./images/1280px-Flag_of_Germany.svg (2).svg" alt="Brazil Flag">
                        <div class="boxflag__content">
                            <h2 class="hero__h2">Brazil</h2>
                        </div>
                    </div>
                    <div class="boxflag">
                        <img src="./images/1280px-Flag_of_Germany.svg (4).svg" alt="Iceland Flag">
                        <div class="boxflag__content">
                            <h2 class="hero__h2">Iceland</h2>
                        </div>
                    </div>
                    <div class="boxflag">
                        <img src="./images/1280px-Flag_of_Germany.svg (5).svg" alt="Afghanistan Flag">
                        <div class="boxflag__content">
                            <h2 class="hero__h2">Afghanistan</h2>
                        </div>
                    </div>
                    <div class="boxflag">
                        <img src="./images/1280px-Flag_of_Germany.svg (6).svg" alt="Aland Islands Flag">
                        <div class="boxflag__content">
                            <h2 class="hero__h2">Åland Islands</h2>
                        </div>
                    </div>
                    <div class="boxflag">
                        <img src="./images/1280px-Flag_of_Germany.svg (7).svg" alt="Albania Flag">
                        <div class="boxflag__content">
                            <h2 class="hero__h2">Albania</h2>
                        </div>
                    </div>
                    <div class="boxflag">
                        <img src="./images/1280px-Flag_of_Germany.svg (8).svg" alt="Algeria Flag">
                        <div class="boxflag__content">
                            <h2 class="hero__h2">Algeria</h2>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
